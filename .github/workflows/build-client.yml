name: Build RustDesk Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    
    - name: Install LLVM
      run: choco install -y llvm
    
    - name: Cache vcpkg dependencies
      uses: actions/cache@v4
      with:
        path: C:\vcpkg\installed
        key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        # 缓存 target/ 和 ~/.cargo，依赖不变时跳过重复编译
        cache-on-failure: true

    - name: Setup vcpkg
      shell: bash
      run: |
        # Windows runners 已经预装了 vcpkg
        cd $VCPKG_INSTALLATION_ROOT
        git fetch
        git checkout 120deac3062162151622ca4860575a33844ba10b
        ./bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
    
    - name: Install dependencies via vcpkg
      shell: bash
      run: |
        # 在 vcpkg 根目录以 classic 模式安装，确保装到 $VCPKG_INSTALLATION_ROOT/installed/x64-windows-static
        # （在项目目录运行会因 vcpkg.json 进入 manifest 模式，装到项目下的 vcpkg_installed/，
        #   导致 magnum-opus 等构建脚本在 C:\vcpkg\installed 下找不到头文件）
        cd "$VCPKG_INSTALLATION_ROOT"
        vcpkg install --triplet x64-windows-static libvpx libyuv opus aom

    - name: Update build date
      shell: bash
      run: |
        # 每次构建自动更新构建日期（+ commit hash），客户端右下角显示，便于排查问题
        DATE=$(date -u '+%Y-%m-%d %H:%M')
        SHA=$(git rev-parse --short HEAD)
        sed -i "s|pub const BUILD_DATE: &str = \"[^\"]*\";|pub const BUILD_DATE: \&str = \"$DATE ($SHA)\";|" src/version.rs
        cat src/version.rs

    - name: Build
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        cargo build --release --features inline
    
    - name: Download sciter.dll
      shell: bash
      run: |
        # sciter-rs (dyn) 运行时需要与 rdassistant.exe 同目录的 sciter.dll，缺失会 panic 退出
        curl -fsSL -o target/release/sciter.dll "https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x64/sciter.dll"
        head -c 2 target/release/sciter.dll | grep -q MZ || (echo "sciter.dll 下载不完整" && exit 1)

    - name: Install NSIS
      shell: cmd
      run: choco install nsis -y --no-progress

    - name: Build installer (NSIS)
      shell: cmd
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-windows-x64
        path: |
          target/release/888.exe
          target/release/sciter.dll
          888-setup.exe

  build-macos:
    if: false  # 已禁用 macOS 构建以加速
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    
    - name: Install dependencies
      run: |
        brew install llvm create-dmg nasm yasm
    
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg install libvpx libyuv opus aom
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
    
    - name: Build
      run: |
        cargo build --release --features hwcodec
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-macos
        path: target/release/rustdesk

  build-linux:
    if: false  # 已禁用 Linux 构建以加速
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++ gcc git curl wget nasm yasm \
          libgtk-3-dev clang libxcb-randr0-dev libxdo-dev \
          libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev \
          libpulse-dev cmake libclang-dev ninja-build \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libappindicator3-dev libva-dev libvdpau-dev
    
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg install libvpx libyuv opus aom
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
    
    - name: Build
      run: |
        cargo build --release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-linux-x64
        path: target/release/rustdesk
