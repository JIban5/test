name: Build RustDesk Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    
    - name: Install LLVM
      run: choco install -y llvm
    
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    
    - name: Install dependencies via vcpkg
      run: |
        C:\vcpkg\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
    
    - name: Build
      run: cargo build --release --features inline
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-windows-x64
        path: target/release/rustdesk.exe

  build-macos:
    if: false  # 已禁用 macOS 构建以加速
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    
    - name: Install dependencies
      run: |
        brew install llvm create-dmg nasm yasm
    
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg install libvpx libyuv opus aom
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
    
    - name: Build
      run: |
        cargo build --release --features hwcodec
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-macos
        path: target/release/rustdesk

  build-linux:
    if: false  # 已禁用 Linux 构建以加速
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++ gcc git curl wget nasm yasm \
          libgtk-3-dev clang libxcb-randr0-dev libxdo-dev \
          libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev \
          libpulse-dev cmake libclang-dev ninja-build \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libappindicator3-dev libva-dev libvdpau-dev
    
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg install libvpx libyuv opus aom
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
    
    - name: Build
      run: |
        cargo build --release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-linux-x64
        path: target/release/rustdesk
