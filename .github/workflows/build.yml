name: Build RustDesk Client

on:
  push:
    tags:
      - 'v*'  # 当推送 v1.0.0 这样的标签时触发
  workflow_dispatch:  # 允许手动触发

env:
  CARGO_TERM_COLOR: always
  RUSTDESK_VERSION: ${{ github.ref_name }}

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14  # macOS with Apple Silicon
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: |
          brew install llvm create-dmg nasm cmake
          
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=~/vcpkg
          ~/vcpkg/vcpkg install libvpx libyuv opus
      
      - name: Build RustDesk
        run: |
          export VCPKG_ROOT=~/vcpkg
          python3 build.py --flutter --hwcodec
      
      - name: Create DMG
        run: |
          create-dmg \
            --volname "RustDesk" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "RustDesk-${{ github.ref_name }}-macos-arm64.dmg" \
            "flutter/build/macos/Build/Products/Release/RustDesk.app"
      
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos-arm64
          path: RustDesk-${{ github.ref_name }}-macos-arm64.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Install LLVM
        run: |
          choco install llvm -y
          choco install nasm -y
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          $env:VCPKG_ROOT = "C:\vcpkg"
          C:\vcpkg\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
        shell: powershell
      
      - name: Build RustDesk
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          python build.py --flutter --hwcodec
        shell: powershell
      
      - name: Build Installer
        run: |
          makensis installer.nsi
        shell: cmd
      
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: rustdesk-*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget build-essential pkg-config \
            libssl-dev cmake ninja-build \
            libgtk-3-dev libxcb-randr0-dev libxdo-dev \
            libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libva-dev libvdpau-dev \
            libclang-dev llvm-dev nasm
      
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=~/vcpkg
          ~/vcpkg/vcpkg install libvpx libyuv opus
      
      - name: Build RustDesk
        run: |
          export VCPKG_ROOT=~/vcpkg
          python3 build.py --flutter --hwcodec
      
      - name: Package Linux
        run: |
          mkdir -p rustdesk-linux
          cp target/release/rustdesk rustdesk-linux/
          cp -r flutter/build/linux/x64/release/bundle/* rustdesk-linux/
          tar -czf RustDesk-${{ github.ref_name }}-linux-x86_64.tar.gz rustdesk-linux/
      
      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux
          path: RustDesk-${{ github.ref_name }}-linux-x86_64.tar.gz

  release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            rustdesk-macos-arm64/*
            rustdesk-windows/*
            rustdesk-linux/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
